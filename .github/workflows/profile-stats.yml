name: Update profile visuals

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/profile_stats.py"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate skyline.svg and stats.svg
        run: python scripts/profile_stats.py
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          # Optional: add a PROFILE_TOKEN secret (classic PAT with read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline.svg assets/stats.svg
          git diff --staged --quiet || (git commit -m "chore: refresh profile visuals" && git push)
