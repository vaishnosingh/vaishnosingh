<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 68" width="1000" height="68" role="img" aria-label="TECH STACK">
  <title>TECH STACK</title>
  <defs>
    <linearGradient id="railL_02" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="railR_02" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <filter id="badgeShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Architectural Rail -->
  <line x1="40" y1="34" x2="310" y2="34" stroke="url(#railL_02)" stroke-width="1.5"/>
  <circle cx="120" cy="34" r="2" fill="#334155"/>
  <circle cx="220" cy="34" r="2.5" fill="#6366F1" fill-opacity="0.7"/>

  <!-- Right Architectural Rail -->
  <line x1="690" y1="34" x2="960" y2="34" stroke="url(#railR_02)" stroke-width="1.5"/>
  <circle cx="780" cy="34" r="2.5" fill="#6366F1" fill-opacity="0.7"/>
  <circle cx="880" cy="34" r="2" fill="#334155"/>

  <!-- 3D Center Floating Badge -->
  <g transform="translate(320, 12)" filter="url(#badgeShadow)">
    <rect width="360" height="44" rx="22" fill="url(#badgeBg)" stroke="#1F2937" stroke-width="1"/>
    <!-- 3D Specular Top Rim -->
    <path d="M 22,1 L 338,1" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-linecap="round"/>

    <!-- Glowing Indicator Dot -->
    <circle cx="28" cy="22" r="4.5" fill="#6366F1"/>
    <circle cx="28" cy="22" r="8" fill="none" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Label Text -->
    <text x="46" y="27" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#6366F1">// 02</text>
    <text x="96" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" letter-spacing="1.8">TECH STACK</text>
  </g>
</svg>