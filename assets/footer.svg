<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Vaishno Kumar Singh Footer">
  <title>Vaishno Kumar Singh Footer</title>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="footerTopRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="999" height="129" rx="16" fill="url(#footerBg)" stroke="#1E293B" stroke-width="1"/>
  <path d="M 16,1 L 984,1" stroke="url(#footerTopRim)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Content -->
  <g transform="translate(500, 48)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" letter-spacing="-0.2">
      "Building intelligent systems with curiosity, mathematics, and clean architecture."
    </text>
    
    <g transform="translate(0, 32)">
      <circle cx="-160" cy="-4" r="3.5" fill="#10B981"/>
      <text x="0" y="0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" fill="#94A3B8">
        © 2026 Vaishno Kumar Singh  <tspan fill="#334155">•</tspan>  Engineered for Performance  <tspan fill="#334155">•</tspan>  All Systems Operational
      </text>
    </g>
  </g>
</svg>