xt class="n" x="48" y="228">7</text><text x="68" y="228">        <tspan class="s">self</tspan><tspan class="p">.</tspan>ask_me_about <tspan class="p">=</tspan> <tspan class="p">[</tspan><tspan class="st">"Python"</tspan><tspan class="p">, </tspan><tspan class="st">"Data Structures &amp; Algorithms"</tspan><tspan class="p">]</tspan></text></g><g class="L" style="animation-delay:1.96s"><text class="n" x="48" y="252">8</text><text x="68" y="252">        <tspan class="s">self</tspan><tspan class="p">.</tspan>fun_fact     <tspan class="p">=</tspan> <tspan class="st">"I think I am funny 🌝"</tspan></text></g><g class="L" style="animation-delay:2.24s"><text class="n" x="48" y="276">9</text><text x="68" y="276"></text></g><g class="L" style="animation-delay:2.52s"><text class="n" x="48" y="300">10</text><text x="68" y="300">    <tspan class="k">def</tspan> <tspan class="f">say_hi</tspan><tspan class="p">(</tspan><tspan class="s">self</tspan><tspan class="p">):</tspan></text></g><g class="L" style="animation-delay:2.80s"><text class="n" x="48" y="324">11</text><text x="68" y="324">        <tspan class="f">print</tspan><tspan class="p">(</tspan><tspan class="st">"Thanks for stopping by! Let's build something awesome. 🚀"</tspan><tspan class="p">)</tspan></text></g><g class="L" style="animation-delay:3.08s"><text class="n" x="48" y="348">12</text><text x="68" y="348"></text></g><g class="L" style="animation-delay:3.36s"><text class="n" x="48" y="372">13</text><text x="68" y="372"><tspan class="v">me</tspan> <tspan class="p">=</tspan> <tspan class="c">VaishnoKumarSingh</tspan><tspan class="p">()</tspan></text></g><g class="L" style="animation-delay:3.64s"><text class="n" x="48" y="396">14</text><text x="68" y="396"><tspan class="v">me</tspan><tspan class="p">.</tspan><tspan class="f">say_hi</tspan><tspan class="p">()</tspan></text></g><g class="L" style="animation-delay:4.6s"><text x="68" y="444"><tspan fill="#1FC6B4">$</tspan> <tspan class="v">python about.py</tspan></text></g><