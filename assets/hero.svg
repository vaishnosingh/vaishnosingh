<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Vaishno Kumar Singh, Software Developer &amp; AI Engineer">
  <title>Vaishno Kumar Singh, Software Developer &amp; AI Engineer</title>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="heroTopRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="roleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="ambientCyan" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientIndigo" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="nameShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base 3D Hardware Canvas -->
  <rect x="0.5" y="0.5" width="999" height="419" rx="18" fill="url(#heroBg)" stroke="#1E293B" stroke-width="1"/>
  <rect x="1" y="1" width="998" height="418" rx="17" fill="url(#ambientCyan)"/>
  <rect x="1" y="1" width="998" height="418" rx="17" fill="url(#ambientIndigo)"/>
  <!-- Specular 3D Top Rim Highlight -->
  <path d="M 18,1 L 982,1" stroke="url(#heroTopRim)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Subtle Blueprint Grid Lines on Right Side -->
  <g opacity="0.15">
    <line x1="560" y1="40" x2="940" y2="40" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="560" y1="140" x2="940" y2="140" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="560" y1="240" x2="940" y2="240" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="560" y1="340" x2="940" y2="340" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="600" y1="30" x2="600" y2="390" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="750" y1="30" x2="750" y2="390" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="900" y1="30" x2="900" y2="390" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <!-- ================= LEFT: PROFILE DETAILS ================= -->
  <g transform="translate(48, 44)">
    <!-- Status Pill -->
    <g>
      <rect width="360" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="1" y="1" width="358" height="1" rx="0.5" fill="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4.5" fill="#10B981"/>
      <circle cx="14" cy="14" r="8" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="30" y="18" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">OPEN TO HIGH-IMPACT OPPORTUNITIES</text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="50" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.2" filter="url(#nameShadow)">Vaishno Kumar Singh</text>

    <!-- Role / Title -->
    <text x="0" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#roleGrad)" letter-spacing="-0.3">Software Developer &amp; AI/ML Engineer</text>

    <!-- Bio Description -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      <tspan x="0" dy="0">Architecting intelligent backend systems, production AI pipelines,</tspan>
      <tspan x="0" dy="24">and scalable cloud software with clean code and computational rigor.</tspan>
    </text>

    <!-- 3D Feature Badges (2x2 Grid) -->
    <g transform="translate(0, 218)">
      <!-- Badge 1: Python & Go -->
      <g transform="translate(0, 0)" filter="url(#cardShadow)">
        <rect width="210" height="38" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
        <rect x="1" y="1" width="208" height="1" rx="0.5" fill="rgba(255,255,255,0.08)"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F8FAFC">🐍 Python &amp; Golang</text>
      </g>

      <!-- Badge 2: AI & Deep Learning -->
      <g transform="translate(222, 0)" filter="url(#cardShadow)">
        <rect width="210" height="38" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
        <rect x="1" y="1" width="208" height="1" rx="0.5" fill="rgba(255,255,255,0.08)"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F8FAFC">🧠 AI &amp; Deep Learning</text>
      </g>

      <!-- Badge 3: FastAPI & Backend -->
      <g transform="translate(0, 48)" filter="url(#cardShadow)">
        <rect width="210" height="38" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
        <rect x="1" y="1" width="208" height="1" rx="0.5" fill="rgba(255,255,255,0.08)"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F8FAFC">⚡ FastAPI &amp; Microservices</text>
      </g>

      <!-- Badge 4: Linux & Systems -->
      <g transform="translate(222, 48)" filter="url(#cardShadow)">
        <rect width="210" height="38" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1"/>
        <rect x="1" y="1" width="208" height="1" rx="0.5" fill="rgba(255,255,255,0.08)"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#F8FAFC">🐧 Linux &amp; Cloud Infra</text>
      </g>
    </g>

    <!-- Location & Focus Footer -->
    <text x="2" y="332" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" fill="#64748B">
      📍 INDIA  <tspan fill="#334155">•</tspan>  CORE: DISTRIBUTED SYSTEMS &amp; MACHINE LEARNING
    </text>
  </g>

  <!-- ================= RIGHT: 3D ISOMETRIC ARCHITECTURE ================= -->
  <g transform="translate(740, 205)">
    <!-- Dimension Marker Badge on Top Right -->
    <g transform="translate(-140, -150)">
      <rect width="180" height="24" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="3.5" fill="#38BDF8"/>
      <text x="24" y="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#94A3B8">3D SYSTEMS MATRIX</text>
    </g>

    <!-- Layer 1: INFRASTRUCTURE (Base Slab) at cy = 90 -->
    <g transform="translate(0, 90)">
      <polygon points="-150,0 0,75 0,95 -150,20" fill="#0A0F1D" stroke="#1E293B" stroke-width="0.5"/>
      <polygon points="0,75 150,0 150,20 0,95" fill="#080C17" stroke="#1E293B" stroke-width="0.5"/>
      <polygon points="0,-75 150,0 0,75 -150,0" fill="#0F172A" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.2"/>
      <polygon points="0,-40 80,0 0,40 -80,0" fill="#131C33" stroke="#1E293B" stroke-width="0.8"/>
      <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="1">DATA &amp; INFRASTRUCTURE</text>
      <text x="0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="10" fill="#94A3B8">PostgreSQL • Linux • Docker</text>
    </g>

    <!-- Glowing Vertical Data Conduits (Base to Middle) -->
    <line x1="-70" y1="65" x2="-70" y2="20" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="70" y1="65" x2="70" y2="20" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="0" y1="120" x2="0" y2="70" stroke="#6366F1" stroke-opacity="0.8" stroke-width="1.5"/>

    <!-- Layer 2: BACKEND ENGINE (Middle Slab) at cy = 10 -->
    <g transform="translate(0, 10)">
      <polygon points="-140,0 0,70 0,86 -140,16" fill="#0E1626" stroke="#1E293B" stroke-width="0.5"/>
      <polygon points="0,70 140,0 140,16 0,86" fill="#0A101C" stroke="#1E293B" stroke-width="0.5"/>
      <polygon points="0,-70 140,0 0,70 -140,0" fill="#131F38" stroke="#6366F1" stroke-opacity="0.8" stroke-width="1.4"/>
      <polygon points="0,-36 72,0 0,36 -72,0" fill="#182747" stroke="#1E293B" stroke-width="0.8"/>
      <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#818CF8" letter-spacing="1">SERVICES &amp; LOGIC</text>
      <text x="0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="10" fill="#CBD5E1">Python • Go • FastAPI</text>
    </g>

    <!-- Glowing Vertical Data Conduits (Middle to Top) -->
    <line x1="-60" y1="-15" x2="-60" y2="-60" stroke="#6366F1" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="60" y1="-15" x2="60" y2="-60" stroke="#6366F1" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="0" y1="40" x2="0" y2="-10" stroke="#38BDF8" stroke-opacity="0.9" stroke-width="1.5"/>

    <!-- Layer 3: INTELLIGENCE & MODELS (Top Slab) at cy = -70 -->
    <g transform="translate(0, -70)">
      <polygon points="-130,0 0,65 0,79 -130,14" fill="#132038" stroke="#1E293B" stroke-width="0.5"/>
      <polygon points="0,65 130,0 130,14 0,79" fill="#0E1729" stroke="#1E293B" stroke-width="0.5"/>
      <polygon points="0,-65 130,0 0,65 -130,0" fill="#1A2B4C" stroke="#38BDF8" stroke-width="1.6"/>
      <polygon points="0,-32 64,0 0,32 -64,0" fill="#20365F" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="1">AI &amp; MACHINE LEARNING</text>
      <text x="0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="10" fill="#F8FAFC">PyTorch • TensorFlow • Vision</text>
    </g>

    <!-- Floating Top 3D Indicator / Neural Node -->
    <g transform="translate(0, -112)">
      <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    </g>
  </g>
</svg>