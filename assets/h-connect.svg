<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" viewBox="0 0 1000 92" width="1000" height="92" role="img" aria-label="Say hello" xmlns:c2pa="http://c2pa.org/manifest"><title>Say hello</title><defs><style>
@keyframes dr{to{transform:translateX(1000px)}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.tw{fill:#fff;animation:tw 3.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate(calc(var(--k)*-1.25px),calc(var(--k)*1.15px))}50%{transform:translate(calc(var(--k)*1.25px),calc(var(--k)*1.15px))}}
.ex{transform:translate(calc(var(--k)*-.6px),calc(var(--k)*1.1px));animation:sway 9s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:up 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bob{animation:bob 7s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.35);opacity:.1}}
.pu{animation:pu 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.L{opacity:1!important}.r:not(.f){display:none}.r.f{opacity:1!important}}
